<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="60%" stop-color="#0f131a" />
      <stop offset="100%" stop-color="#080a0e" />
    </radialGradient>

    <!-- Ripstop Micro Weave Pattern -->
    <pattern id="microWeave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#141820" />
      <path d="M0,4 L8,4 M4,0 L4,8" stroke="#1f2633" stroke-width="0.8" />
      <rect x="1" y="1" width="2" height="2" fill="#252e3d" opacity="0.6"/>
      <rect x="5" y="5" width="2" height="2" fill="#252e3d" opacity="0.6"/>
    </pattern>

    <!-- Ripstop Reinforcement Grid Pattern -->
    <pattern id="ripstopGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none" />
      <!-- Double reinforced threads horizontal & vertical -->
      <line x1="0" y1="0" x2="60" y2="0" stroke="#3b82f6" stroke-width="2.5" opacity="0.55" stroke-dasharray="3,1" />
      <line x1="0" y1="2" x2="60" y2="2" stroke="#60a5fa" stroke-width="1.2" opacity="0.8" />
      <line x1="0" y1="0" x2="0" y2="60" stroke="#3b82f6" stroke-width="2.5" opacity="0.55" stroke-dasharray="3,1" />
      <line x1="2" y1="0" x2="2" y2="60" stroke="#60a5fa" stroke-width="1.2" opacity="0.8" />
      <!-- Cross intersection node -->
      <circle cx="1" cy="1" r="3" fill="#93c5fd" opacity="0.9" />
    </pattern>

    <!-- Water Droplet Radial -->
    <radialGradient id="dropGrad1" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#93c5fd" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.85" />
    </radialGradient>

    <radialGradient id="dropGrad2" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#60a5fa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.8" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.85" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Micro Texture Weave Layer -->
  <rect width="800" height="600" fill="url(#microWeave)" />

  <!-- Tactical Ripstop Reinforcement Grid -->
  <rect width="800" height="600" fill="url(#ripstopGrid)" />

  <!-- Dynamic Sheen / Studio Lighting Across Weave -->
  <path d="M-50,650 L450,-50 L600,-50 L100,650 Z" fill="#ffffff" opacity="0.04" />
  <path d="M150,650 L650,-50 L750,-50 L250,650 Z" fill="#38bdf8" opacity="0.03" />

  <!-- Water Droplets Beading on Hydrophobic PU Coating -->
  <!-- Droplet 1 (Large hero droplet) -->
  <g filter="url(#dropShadow)">
    <ellipse cx="380" cy="240" rx="42" ry="36" fill="url(#dropGrad1)" transform="rotate(-15, 380, 240)" />
    <!-- Specular highlight glints -->
    <ellipse cx="366" cy="225" rx="12" ry="6" fill="#ffffff" opacity="0.95" transform="rotate(-25, 366, 225)" />
    <circle cx="395" cy="248" r="4" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Droplet 2 -->
  <g filter="url(#dropShadow)">
    <circle cx="490" cy="180" r="24" fill="url(#dropGrad2)" />
    <ellipse cx="482" cy="172" rx="7" ry="4" fill="#ffffff" opacity="0.9" transform="rotate(-20, 482, 172)" />
  </g>

  <!-- Droplet 3 -->
  <g filter="url(#dropShadow)">
    <circle cx="260" cy="330" r="28" fill="url(#dropGrad1)" />
    <ellipse cx="251" cy="321" rx="8" ry="4.5" fill="#ffffff" opacity="0.9" transform="rotate(-30, 251, 321)" />
  </g>

  <!-- Droplet 4 (Small bead) -->
  <g filter="url(#dropShadow)">
    <circle cx="560" cy="290" r="14" fill="url(#dropGrad2)" />
    <ellipse cx="555" cy="286" rx="4" ry="2" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- Droplet 5 -->
  <g filter="url(#dropShadow)">
    <circle cx="310" cy="160" r="16" fill="url(#dropGrad2)" />
    <circle cx="306" cy="156" r="4" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Droplet 6 (Tiny splash bead) -->
  <circle cx="430" cy="310" r="9" fill="url(#dropGrad1)" filter="url(#dropShadow)" />
  <circle cx="427" cy="307" r="2.5" fill="#ffffff" opacity="0.9" />

  <!-- Tactical HUD & Macro Spec Callouts -->
  <!-- Top Badge -->
  <rect x="36" y="32" width="280" height="34" rx="6" fill="#0b1320" stroke="#3b82f6" stroke-width="1.2" opacity="0.92" />
  <circle cx="54" cy="49" r="5" fill="#10b981" />
  <text x="68" y="54" fill="#60a5fa" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">210T REINFORCED RIPSTOP</text>

  <!-- Spec Callout Card Bottom -->
  <g transform="translate(36, 440)">
    <rect width="728" height="124" rx="12" fill="#0c111a" fill-opacity="0.92" stroke="#1f2937" stroke-width="1.5" />
    <line x1="242" y1="16" x2="242" y2="108" stroke="#1f2937" stroke-width="1" />
    <line x1="484" y1="16" x2="484" y2="108" stroke="#1f2937" stroke-width="1" />

    <!-- Feature 1 -->
    <text x="24" y="38" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">TENSILE REINFORCEMENT</text>
    <text x="24" y="64" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">Anti-Tear Square Grid</text>
    <text x="24" y="88" fill="#60a5fa" font-family="sans-serif" font-size="12">Interlocking 0.5cm Crosshatch</text>

    <!-- Feature 2 -->
    <text x="266" y="38" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">HYDROPHOBIC BARRIER</text>
    <text x="266" y="64" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">10,000mm PU Coating</text>
    <text x="266" y="88" fill="#34d399" font-family="sans-serif" font-size="12">Water Beads &amp; Rolls Off</text>

    <!-- Feature 3 -->
    <text x="508" y="38" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">OUTDOOR &amp; TRAVEL</text>
    <text x="508" y="64" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">Ultra-Lightweight &amp; Tough</text>
    <text x="508" y="88" fill="#fbbf24" font-family="sans-serif" font-size="12">Compact Fold &amp; High Windproof</text>
  </g>
</svg>
